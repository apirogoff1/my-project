name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/myproject
          JWT_SECRET: ci-test-secret-key-32-chars-minimum
          GROQ_API_KEY: dummy-key-for-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_TELEGRAM_BOT_NAME: test_bot
